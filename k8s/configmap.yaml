apiVersion: v1
kind: ConfigMap
metadata:
  name: users-api-config
  namespace: fcg
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  JwtSettings__Issuer: "FCG.UsersAPI"
  JwtSettings__Audience: "FCG.Services"
  JwtSettings__ExpirationHours: "8"
  RabbitMq__Host: "rabbitmq"
  RabbitMq__Port: "5672"
  RabbitMq__VirtualHost: "/"
  # Cria o administrador inicial. Sem ele, um ambiente novo sobe sem ninguem
  # capaz de cadastrar jogos: nao existe rota para promover um usuario.
  SeedData__Enabled: "true"
  SeedData__AdminEmail: "admin@fcg.com"
  Swagger__Enabled: "true"
