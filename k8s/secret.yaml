# Valores são placeholders ${VAR}: a pipeline de deploy (.github/workflows/ci.yml)
# os substitui via envsubst a partir de GitHub Secrets antes do kubectl apply.
# Nenhum segredo real é commitado. Ver README.md > CI/CD.
apiVersion: v1
kind: Secret
metadata:
  name: users-api-secret
  namespace: fcg
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=users_db;Username=users_user;Password=${USERS_DB_PASSWORD}"
  JwtSettings__Secret: "${JWT_SECRET}"
  RabbitMq__Username: "guest"
  RabbitMq__Password: "guest"
  SeedData__AdminPassword: "${SEED_ADMIN_PASSWORD}"
