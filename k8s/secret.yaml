# NOTA: valores em texto puro são apenas para o desafio acadêmico.
# Em produção: use SealedSecrets, External Secrets Operator ou injete via CSI Driver.
apiVersion: v1
kind: Secret
metadata:
  name: users-api-secret
  namespace: fcg
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=users_db;Username=users_user;Password=users_pwd"
  JwtSettings__Secret: "fcg-dev-secret-change-me-minimum-32-chars"
  RabbitMq__Username: "guest"
  RabbitMq__Password: "guest"
